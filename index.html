<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2Z Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--card:#fff;--ink:#161a3a;--mute:#6b7194;--line:#dfe3f1;--acc:#3d5afe;--acc2:#ffc83d;--bad:#d6334a}
@media(prefers-color-scheme:dark){:root{--bg:#10122b;--card:#1a1d3d;--ink:#eef0ff;--mute:#9aa0c9;--line:#2b2f5a;--acc:#7b8cff;--acc2:#ffc83d}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 28px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;background:var(--ink);color:var(--bg);border-radius:10px;padding:2px 9px;font-size:22px}
.hero h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-1.5px;max-width:14ch}
.hero p{color:var(--mute);margin:14px 0 30px;max-width:46ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vid{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s}
.vid:hover{transform:translateY(-3px);border-color:var(--acc)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--acc),#8e44ff);display:grid;place-items:center;color:#fff;font-size:34px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vid h3{font-size:16px;font-weight:700;padding:12px 14px 14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--mute)}
/* keypad page */
.back{display:inline-flex;gap:8px;align-items:center;font-weight:700;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:22px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.key{height:56px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;transition:transform .08s,background .08s}
.key:active{transform:scale(.92);background:var(--acc2);color:#161a3a}
h2{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;letter-spacing:-.5px;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:22px}
.sec{margin:26px 0 10px;font-weight:700;color:var(--mute);font-size:14px}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(10,12,30,.6);display:none;place-items:center;padding:16px;z-index:9}
.ov.on{display:grid}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:360px}
.box h3{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin-bottom:12px}
input[type=text],input[type=password],input[type=url]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.btn{background:var(--acc);color:#fff;font-weight:700;padding:13px 20px;border-radius:12px;margin-top:12px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
/* admin */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:26px}
.panel label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.pv{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--bg)}
.pv .thumb{width:120px;aspect-ratio:16/9;border-radius:8px;flex:none;font-size:20px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row .thumb{width:96px;aspect-ratio:16/9;border-radius:8px;flex:none;font-size:18px;overflow:hidden}
.row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{color:var(--bad);font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.note{background:var(--acc2);color:#161a3a;padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <header><button class="logo" id="logo" aria-label="A2Z Hub"><i>A2Z</i>Hub</button></header>
  <div class="hero">
    <h1>Sab kuch, A se Z tak.</h1>
    <p>Videos, tutorials, gameplay, kuch bhi. Kisi bhi card pe tap karo aur seedha video pe pahuncho.</p>
  </div>
  <div class="grid" id="list"></div>
</section>

<!-- KEYPAD PAGE -->
<section id="keypad" hidden>
  <button class="back" id="kBack">&larr; Back</button>
  <h2>A2Z Hub</h2>
  <p class="sub">A se Z, 0 se 9 aur symbols.</p>
  <div class="sec">Letters</div><div class="keys" id="kA"></div>
  <div class="sec">Numbers</div><div class="keys" id="kN"></div>
  <div class="sec">Symbols</div><div class="keys" id="kS"></div>
</section>

<!-- ADMIN -->
<section id="admin" hidden>
  <div class="top"><h2>Admin panel</h2><button class="back" id="aOut" style="margin:0">Logout</button></div>
  <div class="note" id="demo" hidden>Demo mode: Firebase set nahi hai, isliye links sirf is browser me save honge.</div>
  <div class="panel">
    <label for="url">Video link</label>
    <input type="url" id="url" placeholder="https://youtube.com/watch?v=...">
    <div class="pv" id="pv" hidden><div class="thumb" id="pvT"></div><b id="pvN"></b></div>
    <label for="ttl">Title (auto aa jata hai, chaho to badal sakte ho)</label>
    <input type="text" id="ttl" placeholder="Video ka naam">
    <div class="err" id="aErr"></div>
    <button class="btn" id="add">Add link</button>
  </div>
  <h2 style="font-size:22px">Saved links</h2>
  <div style="height:12px"></div>
  <div id="aList"></div>
</section>
</div>

<!-- CODE DIALOG -->
<div class="ov" id="ov">
  <div class="box">
    <h3>Enter code</h3>
    <input type="password" id="code" maxlength="7" autocomplete="off" autocapitalize="characters" placeholder="7 letter code">
    <div class="err" id="cErr"></div>
    <button class="btn" id="go">Unlock</button>
    <button class="btn ghost" id="cx" style="margin-left:8px">Cancel</button>
  </div>
</div>

<script type="module">
/* ===== SETTINGS ===== */
// Firebase config yaha paste karo (guide ke hisaab se). Khali chhodoge to demo mode chalega.
const firebaseConfig = {
  apiKey: "AIzaSyC9CYfB-fhkW2kKZnrbuYCQU5ffpPEl7lA",
  authDomain: "a2zhub-f6279.firebaseapp.com",
  projectId: "a2zhub-f6279",
  storageBucket: "a2zhub-f6279.firebasestorage.app",
  messagingSenderId: "741436149426",
  appId: "1:741436149426:web:60f03a91f7822e8f7a43ab"
};
// Secret code ka SHA-256 hash (code: 7 letters). Code badalna ho to mujhse naya hash maango.
const CODE_HASH = "0d1bf25cd1cbda9b8057773038228f444b3de8b1cf3616b52e8d0475c0314fe1";
/* ==================== */

const $ = id => document.getElementById(id);
const show = id => ["home","keypad","admin"].forEach(s => $(s).hidden = s !== id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

/* ---------- storage (Firebase or local demo) ---------- */
let store, links = [], isAdmin = false;
const useFb = !!firebaseConfig.apiKey;
if (useFb) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const fs = await import(base + "firebase-firestore.js");
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const col = fs.collection(db, "links");
  store = {
    watch: cb => fs.onSnapshot(fs.query(col, fs.orderBy("ts", "desc")), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))),
    add: o => fs.addDoc(col, { ...o, ts: Date.now() }),
    del: id => fs.deleteDoc(fs.doc(db, "links", id))
  };
} else {
  const K = "a2z_links";
  const read = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch { return []; } };
  let cb = () => {};
  store = {
    watch: f => { cb = f; f(read()); },
    add: o => { const a = read(); a.unshift({ id: String(Date.now()), ...o }); localStorage.setItem(K, JSON.stringify(a)); cb(a); },
    del: id => { const a = read().filter(x => x.id !== id); localStorage.setItem(K, JSON.stringify(a)); cb(a); }
  };
}

/* ---------- render ---------- */
const thumbHtml = l => l.thumb ? `<img src="${esc(l.thumb)}" alt="" loading="lazy" onerror="this.parentNode.textContent='▶'">` : "▶";
function render() {
  $("list").innerHTML = links.length ? links.map(l =>
    `<a class="vid" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener"><div class="thumb">${thumbHtml(l)}</div><h3>${esc(l.title || l.url)}</h3></a>`
  ).join("") : `<div class="empty">Abhi koi video nahi hai. Jaldi hi naye links aayenge.</div>`;
  $("aList").innerHTML = links.length ? links.map(l =>
    `<div class="row"><div class="thumb">${thumbHtml(l)}</div><b>${esc(l.title || l.url)}</b><button class="del" data-id="${esc(l.id)}">Delete</button></div>`
  ).join("") : `<div class="empty">Koi link nahi. Upar se pehla link add karo.</div>`;
}
store.watch(a => { links = a; render(); });
$("aList").onclick = e => { const b = e.target.closest(".del"); if (b && confirm("Ye link delete kar du?")) store.del(b.dataset.id); };

/* ---------- keypad page ---------- */
const mk = (el, chars) => chars.forEach(c => {
  const b = document.createElement("button");
  b.className = "key"; b.textContent = c; b.dataset.k = c; el.appendChild(b);
});
mk($("kA"), "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
mk($("kN"), "1234567890".split(""));
mk($("kS"), ["#","@","!","?",".",",",":",";","-","_","+","=","*","/","&","%","$","(",")"]);
$("logo").onclick = () => { show("keypad"); scrollTo(0, 0); };
$("kBack").onclick = () => show("home");
document.querySelector("#keypad").onclick = e => {
  const k = e.target.closest(".key");
  if (k && (k.dataset.k === "#" || k.dataset.k === "@")) openCode();
};

/* ---------- code dialog ---------- */
const openCode = () => { $("code").value = ""; $("cErr").textContent = ""; $("ov").classList.add("on"); setTimeout(() => $("code").focus(), 50); };
const closeCode = () => $("ov").classList.remove("on");
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function unlock() {
  const v = $("code").value.trim().toUpperCase();
  if (v.length !== 7) { $("cErr").textContent = "Code 7 letters ka hai."; return; }
  if (await sha(v) === CODE_HASH) { isAdmin = true; closeCode(); $("demo").hidden = useFb; show("admin"); scrollTo(0, 0); }
  else { $("cErr").textContent = "Galat code. Dobara try karo."; $("code").select(); }
}
$("go").onclick = unlock; $("cx").onclick = closeCode;
$("code").onkeydown = e => { if (e.key === "Enter") unlock(); };
$("aOut").onclick = () => { isAdmin = false; show("home"); };

/* ---------- admin: auto title + image preview ---------- */
function ytId(u) {
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
let meta = { title: "", thumb: "" }, t;
async function lookup() {
  const u = $("url").value.trim();
  $("pv").hidden = true; meta = { title: "", thumb: "" };
  if (!/^https?:\/\//i.test(u)) return;
  const id = ytId(u);
  if (id) meta.thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  try {
    const r = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(u));
    const d = await r.json();
    if (d.title) meta.title = d.title;
    if (!meta.thumb && d.thumbnail_url) meta.thumb = d.thumbnail_url;
  } catch {}
  if ($("url").value.trim() !== u) return;
  if (meta.title && !$("ttl").dataset.manual) $("ttl").value = meta.title;
  $("pvT").innerHTML = meta.thumb ? `<img src="${esc(meta.thumb)}" alt="">` : "▶";
  $("pvN").textContent = $("ttl").value || "Title nahi mila, upar khud likh do";
  $("pv").hidden = false;
}
$("url").oninput = () => { clearTimeout(t); $("ttl").dataset.manual = ""; t = setTimeout(lookup, 500); };
$("ttl").oninput = () => { $("ttl").dataset.manual = "1"; $("pvN").textContent = $("ttl").value; };
$("add").onclick = async () => {
  const url = $("url").value.trim(), title = $("ttl").value.trim();
  if (!isAdmin) return;
  if (!/^https?:\/\//i.test(url)) { $("aErr").textContent = "Pura link daalo (https:// se shuru)."; return; }
  if (!title) { $("aErr").textContent = "Title likh do."; return; }
  $("aErr").textContent = "";
  await store.add({ url, title, thumb: meta.thumb || "" });
  $("url").value = ""; $("ttl").value = ""; $("ttl").dataset.manual = ""; $("pv").hidden = true;
};
</script>
</body>
</html>
